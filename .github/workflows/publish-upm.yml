name: Publish UPM

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/ECSReact/package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version Assets/ECSReact/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git identity
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split subtree and update upm branch
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git subtree split --prefix=Assets/ECSReact --branch upm
          git push origin upm --force

      - name: Tag upm branch and push
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git tag "v$VERSION" upm
          git push origin "v$VERSION"
